allowBuilds:
  '@parcel/watcher': true

# node-red-node-test-helper loads @node-red/registry from next to node-red,
# which pnpm's strict layout doesn't provide. Keep in sync with node-red.
packageExtensions:
  node-red:
    dependencies:
      '@node-red/registry': '5.0.9'

overrides:
  "i18next>typescript": "6 || 7"

minimumReleaseAgeExclude:
  - '@txcswe/vite-plugin-node-red-node@1.1.0'
  - glob@14.0.6
  - prettier@3.10.1
